<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Wear4Weather &mdash; WeatherMan1000</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Press+Start+2P&family=VT323&display=swap"
      rel="stylesheet"
    />
    <link rel="stylesheet" href="styles.css" />
  </head>
  <body>
    <main class="shell">
      <header class="hero">
        <h1>WEAR4WEATHER</h1>
        <p class="tag">&#9608; INSERT ZIP &middot; GET A FIT &#9608;</p>
      </header>

      <form id="zip-form" class="zip-form" autocomplete="off">
        <label for="zip" class="visually-hidden">US ZIP code</label>
        <input
          id="zip"
          name="zip"
          type="text"
          inputmode="numeric"
          pattern="\d{5}"
          maxlength="5"
          placeholder="ENTER 5-DIGIT ZIP"
          required
        />
        <button type="submit" id="go-btn">&#9654; STYLE ME</button>
      </form>

      <p id="status" class="status" role="status" aria-live="polite"></p>

      <section id="result" class="result" hidden>
        <div class="location">
          <h2 id="place"></h2>
          <p id="now" class="now"></p>
        </div>

        <div class="scene-frame">
          <canvas
            id="scene"
            width="64"
            height="64"
            aria-label="Pixel character dressed for the current weather"
          ></canvas>
          <p id="scene-caption" class="scene-caption"></p>
        </div>

        <div class="card">
          <h3>Weather Report</h3>
          <p id="summary"></p>
        </div>

        <div class="card">
          <h3>Equipped Gear</h3>
          <p id="outfit"></p>
        </div>

        <div class="card">
          <h3>Inventory</h3>
          <ul id="must-haves"></ul>
        </div>

        <div class="card">
          <h3>Pro Tip</h3>
          <p id="tip"></p>
        </div>

        <details class="forecast">
          <summary>6-HR FORECAST DATA</summary>
          <table id="forecast-table">
            <thead>
              <tr>
                <th>Time</th>
                <th>Temp (&deg;F)</th>
                <th>Humidity</th>
                <th>Precip %</th>
                <th>Wind (mph)</th>
              </tr>
            </thead>
            <tbody></tbody>
          </table>
        </details>
      </section>

      <footer class="foot">
        <small>WEATHER: OPEN-METEO &middot; GEOCODING: ZIPPOPOTAM.US</small>
      </footer>
    </main>

    <script src="app.js"></script>
  </body>
</html>
